{% extends 'base.html' %}{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3"><h2>Tiendas</h2><button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formTienda">Nueva tienda</button></div>
<div id="formTienda" class="collapse mb-4"><div class="card card-body"><form action="{{ url_for('tiendas_nueva') }}" method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Nombre*</label><input class="form-control" name="nombre" required></div><div class="col-md-6"><label class="form-label">Dirección</label><input class="form-control" name="direccion"></div><div class="col-12"><button class="btn btn-success">Guardar</button></div></form></div></div>
<table class="table table-striped align-middle"><thead><tr><th>Nombre</th><th>Dirección</th><th></th></tr></thead><tbody>{% for t in tiendas %}<tr><td>{{ t.nombre }}</td><td>{{ t.direccion }}</td><td class="text-end"><form action="{{ url_for('tiendas_eliminar', tienda_id=t.id) }}" method="post" onsubmit="return confirm('¿Eliminar tienda?');"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr>{% endfor %}</tbody></table>
{% endblock %}
