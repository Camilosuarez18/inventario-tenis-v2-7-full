{% extends 'base.html' %}{% block content %}
<h1 class="mb-4">Panel</h1>
<div class="row g-3 mb-4">
  <div class="col-md-3"><div class="card text-bg-primary"><div class="card-body"><h6>Productos Base</h6><div class="display-6">{{ total_bases }}</div></div></div></div>
  <div class="col-md-3"><div class="card text-bg-success"><div class="card-body"><h6>Variantes</h6><div class="display-6">{{ total_variantes }}</div></div></div></div>
  <div class="col-md-3"><div class="card text-bg-secondary"><div class="card-body"><h6>Tiendas</h6><div class="display-6">{{ total_tiendas }}</div></div></div></div>
  <div class="col-md-3"><div class="card text-bg-dark"><div class="card-body"><h6>Movimientos</h6><div class="display-6">{{ total_movs }}</div></div></div></div>
</div>
<div class="row g-4">
  <div class="col-lg-7"><div class="card"><div class="card-body"><h5 class="card-title">Entradas vs Salidas (30 días)</h5><canvas id="lineChart" height="120"></canvas></div></div></div>
  <div class="col-lg-5"><div class="card"><div class="card-body"><h5 class="card-title">Top 5 más vendidos</h5><canvas id="barChart" height="120"></canvas></div></div></div>
</div>
<script>
const labels={{ chart_labels|tojson }};const e={{ chart_entradas|tojson }};const s={{ chart_salidas|tojson }};
new Chart(document.getElementById('lineChart'),{type:'line',data:{labels:labels,datasets:[{label:'Entradas',data:e,borderColor:'#28a745',backgroundColor:'rgba(40,167,69,0.2)',tension:.2},{label:'Salidas',data:s,borderColor:'#dc3545',backgroundColor:'rgba(220,53,69,0.2)',tension:.2}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}});
new Chart(document.getElementById('barChart'),{type:'bar',data:{labels: {{ top_labels|tojson }}, datasets:[{label:'Unidades vendidas', data: {{ top_values|tojson }}, backgroundColor:'#0d6efd'}]}, options:{indexAxis:'y', responsive:true, scales:{x:{beginAtZero:true}}}});
</script>
{% endblock %}
