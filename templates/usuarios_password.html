{% extends 'base.html' %}{% block content %}
<div class="row"><div class="col-12 col-lg-5"><div class="card"><div class="card-body"><h5 class="card-title">Cambiar contraseña</h5>
<form method="post" class="row g-3">
  <div class="col-12"><label class="form-label">Usuario</label><input class="form-control" value="{{ user.nombre }}" disabled></div>
  <div class="col-12 col-md-6"><label class="form-label">Nueva contraseña</label><input class="form-control" type="password" name="password" minlength="6" required></div>
  <div class="col-12 col-md-6"><label class="form-label">Confirmar</label><input class="form-control" type="password" name="password2" minlength="6" required></div>
  <div class="col-12"><button class="btn btn-primary">Actualizar</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('usuarios_list') }}">Cancelar</a></div>
</form></div></div></div></div>
{% endblock %}
